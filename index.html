/* ─── HOOKS ─── */
function useReveal(threshold=0.12) {
  const ref = React.useRef(null);
  const [vis, setVis] = React.useState(false);
  React.useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{ if(e.isIntersecting){setVis(true);obs.disconnect();} },{threshold});
    obs.observe(el); return ()=>obs.disconnect();
  },[]);
  return [ref,vis];
}
function useMobile() {
  const [mob,setMob]=React.useState(window.innerWidth<768);
  React.useEffect(()=>{
    const fn=()=>setMob(window.innerWidth<768);
    window.addEventListener('resize',fn,{passive:true});
    return ()=>window.removeEventListener('resize',fn);
  },[]);
  return mob;
}
function useSmall() {
  const [sm,setSm]=React.useState(window.innerWidth<480);
  React.useEffect(()=>{
    const fn=()=>setSm(window.innerWidth<480);
    window.addEventListener('resize',fn,{passive:true});
    return ()=>window.removeEventListener('resize',fn);
  },[]);
  return sm;
}

  const fullLogo  = 'logos/LOGO FRESHOUSE INGENIERIA DE FACHADAS BLANCO FONDO TRANSPARENTE.png';

  return (
    <div style={{position:'relative',height,display:'inline-block',flexShrink:0}}>

      <img src={fullLogo} alt="Freshouse"

function BASlider({t,vis}) {
  const [pos,setPos]=React.useState(50);
  const [drag,setDrag]=React.useState(false);
  const ref=React.useRef(null);
  const calc=React.useCallback(e=>{
    const r=ref.current?.getBoundingClientRect();if(!r)return;
    const x=e.touches?e.touches[0].clientX:e.clientX;
    setPos(Math.min(95,Math.max(5,((x-r.left)/r.width)*100)));
  },[]);
  React.useEffect(()=>{
    const up=()=>setDrag(false);
    const mv=e=>{if(drag)calc(e);};
    window.addEventListener('mouseup',up);window.addEventListener('mousemove',mv);
    return()=>{window.removeEventListener('mouseup',up);window.removeEventListener('mousemove',mv);};
  },[drag,calc]);
  return (
    <div ref={ref} onMouseDown={e=>{setDrag(true);calc(e);}} onTouchStart={()=>setDrag(true)} onTouchEnd={()=>setDrag(false)} onTouchMove={e=>{e.preventDefault();calc(e);}}
      style={{position:'relative',width:'100%',aspectRatio:'16/9',borderRadius:12,overflow:'hidden',cursor:'col-resize',userSelect:'none',boxShadow:'0 40px 100px rgba(0,0,0,.5)',opacity:vis?1:0,transform:vis?'translateY(0)':'translateY(28px)',transition:'opacity .9s ease .2s,transform .9s cubic-bezier(.16,1,.3,1) .2s'}}>

        </div>
      </div>
      <div style={{position:'absolute',inset:0,clipPath:`inset(0 ${100-pos}% 0 0)`}}>
        <video src={t.img2} autoPlay muted loop playsInline style={{width:'100%',height:'100%',objectFit:'cover'}}/>

        <div style={{position:'absolute',top:18,right:20}}>

        <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:46,height:46,borderRadius:'50%',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 24px rgba(0,0,0,.3)'}}>

      </div>
    </div>
  );
