<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freshouse — Relación de Obras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1C2347; color: #fff; }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: #1C2347;
      border-bottom: 3px solid #F0921E;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #F0921E;
      letter-spacing: 1px;
    }
    header span {
      font-size: 13px;
      color: #aab;
      font-style: italic;
    }
    .badge {
      margin-left: auto;
      background: #F0921E;
      color: #1C2347;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    #map { width: 100%; height: calc(100vh - 58px); }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper {
      background: #1C2347;
      color: #fff;
      border-radius: 8px;
      border: 1.5px solid #F0921E;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: #F0921E; }
    .leaflet-popup-content { margin: 10px 14px; min-width: 220px; }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #F0921E;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .popup-row {
      font-size: 12px;
      color: #ccd;
      margin: 3px 0;
      display: flex;
      gap: 6px;
    }
    .popup-row span:first-child {
      color: #F0921E;
      font-weight: 600;
      min-width: 60px;
    }
    .popup-valor {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: rgba(240,146,30,0.15);
      padding: 4px 8px;
      border-radius: 4px;
      border-left: 3px solid #F0921E;
    }
    .estado-fin { color: #5df598; font-weight: 600; }
    .estado-eje { color: #f0c040; font-weight: 600; }

    /* Legend */
    .legend {
      background: #1C2347;
      border: 1.5px solid #F0921E;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 2;
    }
    .legend-title { font-weight: 700; color: #F0921E; margin-bottom: 4px; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #ccd; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <h1>FRESHOUSE</h1>
  <span>Ingeniería de Fachadas y Humedades</span>
  <div class="badge">33 Obras</div>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    center: [4.548, -75.685],
    zoom: 13,
    zoomControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  function fmt(val) {
    return '$' + val.toLocaleString('es-CO');
  }

  function marker(lat, lng, nombre, direccion, actividad, estado, valor, admin) {
    const isEjecucion = estado === 'En ejecución';
    const color = isEjecucion ? '#f0c040' : '#F0921E';

    const circle = L.circleMarker([lat, lng], {
      radius: 9,
      fillColor: color,
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.92
    }).addTo(map);

    const estadoClass = isEjecucion ? 'estado-eje' : 'estado-fin';
    const popup = `
      <div class="popup-title">${nombre}</div>
      <div class="popup-row"><span>Dirección</span><span>${direccion}</span></div>
      <div class="popup-row"><span>Actividad</span><span>${actividad}</span></div>
      <div class="popup-row"><span>Estado</span><span class="${estadoClass}">${estado}</span></div>
      ${admin ? `<div class="popup-row"><span>Admin</span><span>${admin}</span></div>` : ''}
      <div class="popup-valor">${fmt(valor)}</div>
    `;
    circle.bindPopup(popup, { maxWidth: 280 });
    return circle;
  }

  // ── OBRAS ──────────────────────────────────────────────────────────────────

  // Zona Franca (La Tebaida)
  marker(4.443,  -75.752, 'Zona Franca Global Latices',     'Km. 13 Vía Armenia-La Tebaida', 'Pinturas especializadas',               'Finalizado',    240000000, 'Camilo Ramírez / 3022682723');
  marker(4.4445, -75.753, 'Zona Franca UMA Bodegas 45 y 46','Km. 13 Vía Armenia-La Tebaida', 'Pinturas especializadas',               'Finalizado',    280000000, 'Johan Ramírez / 3184341550');
  marker(4.446,  -75.754, 'Zona Franca Sabimax',             'Km. 13 Vía Armenia-La Tebaida', 'Pinturas especializadas',               'Finalizado',     75000000, 'Juan Cardona / 3103845941');

  // Reserva de la Colina (La Tebaida)
  marker(4.4440, -75.760, 'Reserva de la Colina — Contrato 1', 'Cl. 10 #3-03, La Tebaida',   'Restauración fachadas (RC-001-2025)',   'Finalizado',    289498090, 'Luz Mary López Montiel');
  marker(4.4450, -75.761, 'Reserva de la Colina — Contrato 2', 'Cl. 10 #3-03, La Tebaida',   'Mantenimiento fachadas bloques A–G',    'Finalizado',    273802969, 'Luz Mary López Montiel');

  // Sur / Centro
  marker(4.521,  -75.671, 'Centro Comercial Plaza Flora',        'Cra. 6 #3-180, Armenia',    'Reparación fachada',                   'Finalizado',     42000000, 'Luisa Fernanda Muñoz / 3042436298');
  marker(4.5215, -75.672, 'Centro Comercial Plaza Flora',        'Cra. 6 #3-180, Armenia',    'Restauración integral fachadas',        'En ejecución',   17288044, 'José David López / 3117668652');

  // Centro histórico
  marker(4.534,  -75.681, 'Condominio Edificio Santo Domingo',   'Parque Sucre, Armenia',     'Restauración fachadas',                'Finalizado',     47000000, 'Idalba Buitrago López / 3155891243');
  marker(4.5345, -75.680, 'Edificio Romanza',                    'Armenia, Quindío',          'Restauración fachada',                 'Finalizado',     12000000, 'Jonathan Colorado / 3158792654');
  marker(4.5350, -75.679, 'Edificio Privé',                      'Armenia, Quindío',          'Restauración fachada',                 'Finalizado',     38000000, 'María del Pilar Rubio / 3103288399');
  marker(4.5355, -75.678, 'Edificio Puerta de Agua',             'Armenia, Quindío',          'Restauración fachadas',                'Finalizado',     43000000, 'Andrea Lorena Duque / 3146082694');

  // Norte bajo (Cl 5N–10N)
  marker(4.541,  -75.675, 'Conjunto Residencial Torre Almería',  'Cl. 5ª Norte #19-35, Armenia','Restauración fachadas',              'Finalizado',    129600000, 'Mariluz Gallego Varón / 3148728860');
  marker(4.543,  -75.675, 'Torre Providencia',                   'Cl. 9a Norte #18-183, Armenia','Restauración fachadas',            'Finalizado',     76000000, 'Mariela Gallón Restrepo / 3113396420');
  marker(4.543,  -75.671, 'Conj. Yulima II Torres D-E',          'Calle 9 #21-51, Armenia',   'Restauración integral fachadas',       'Finalizado',    264866202, 'Luisa Fernanda Gaitán / 3175481749');
  marker(4.5435, -75.670, 'Conj. Yulima II Unidad C',            'Calle 9 #21-51, Armenia',   'Mantenimiento y pintura fachadas',     'Finalizado',    151145830, 'Cinthya Tatiana Arce Duque');

  // Norte medio (Cl 12N–19N)
  marker(4.545,  -75.677, 'Mocawa Plaza',                        'Cra. 14 #9 Norte-00, Armenia','Restauración interiores',            'Finalizado',     30000000, 'Martha L. Castaño / 3155475315');
  marker(4.548,  -75.678, 'Edificio Torre del Parque',           'Cra. 11A #12N-43, Armenia', 'Restauración fachadas',                'Finalizado',     37000000, 'Sonia Beltrán Arango / 3155911097');
  marker(4.548,  -75.676, 'Edificio Torres de Altamira',         'Cra. 15 #12 Norte, Armenia','Restauración fachadas',               'Finalizado',    150000000, 'Carlos Alberto Téllez / 3103998749');
  marker(4.548,  -75.638, 'Conj. Residencial Bello Horizonte',   'Cra. 41 #40-59, Armenia',   'Restauración fachadas',                'Finalizado',     67000000, 'Gloria Mercedes González / 3002692114');
  marker(4.540,  -75.670, 'Conj. Residencial Parque de la Villa','Armenia, Quindío',          'Restauración de fachadas',             'Finalizado',    170000000, 'Claudia Ceballos / 3136727771');
  marker(4.553,  -75.675, 'Edificio Atlantis — Piloto',          'Cl. 19 Norte #18-64, Armenia','Impermeabilización terrazas y pintura','Finalizado',   74000000, '—');
  marker(4.5535, -75.6755,'Edificio Atlantis — Placa',           'Cl. 19 Norte #18-64, Armenia','Impermeabilización placa y áreas comunes','Finalizado',154848413, 'Ing. Luis Fernando Márquez');
  marker(4.5535, -75.675, 'Edificio Los Madrigales',             'Cl. 19 Norte #18-80, Armenia','Reparación fachadas y cubiertas',    'Finalizado',     99234949, 'Freddy Yohan Vargas Araque');

  // Norte alto (Cl 20N–30N)
  marker(4.558,  -75.675, 'Centro Comercial Portal del Quindío', 'Av. Bolívar #19N-46, Armenia','Restauración integral fachadas',     'Finalizado',    144852324, 'Claudia Milena Arteta / 3158955611');
  marker(4.560,  -75.674, 'Edificio El Mirador del Quindío',     'Cra. 19 #26N-69, Armenia',  'Restauración integral fachadas y cubiertas','En ejecución',257643547,'Luis Jaime Manjarres Góngora');
  marker(4.560,  -75.675, 'Conjunto Residencial Santa Catalina', 'Cra. 18 #29N-10, Armenia',  'Restauración fachadas',                'Finalizado',     95000000, 'Magaly Colorado / 3158792654');
  marker(4.554,  -75.674, 'Edificio Panoramika',                 'Cra. 18 #21N-24, Armenia',  'Restauración integral fachadas',       'En ejecución',  296041122, '—');
  marker(4.557,  -75.675, 'Conjunto Residencial Ozono',          'Cl. 22 Norte #17-1, Armenia','Restauración integral fachadas',      'En ejecución',  158666142, 'Fernando Galán Martínez / 3125728427');
  marker(4.562,  -75.679, 'Conjunto Residencial Papiro',         'Cl. 25 Norte #13-41, Armenia','Restauración integral fachadas',     'En ejecución',  301686595, 'Elizabeth López Rojas / 3146614479');

  // Norte muy alto (Cl 30N+)
  marker(4.563,  -75.674, 'Edificio Torre Verde',                'Cra. 19 #31N-91, Armenia',  'Restauración fachadas',                'Finalizado',    131000000, 'Jorge Ariza / 3174003077');
  marker(4.5635, -75.6745,'Edificio Torre Verde — Antepechos',   'Cra. 19 #31N-91, Armenia',  'Reparación antepechos Torre A y tapas','Finalizado',    8044820,  'Jorge Octavio Ariza Marín');
  marker(4.585,  -75.678, 'Conj. Residencial Oro Negro Atardecer','Cl. 46 Norte #14-10, Armenia','Restauración integral fachadas',    'En ejecución',  547567509, 'Gloria Lucía Parra / 3159289936');
  marker(4.589,  -75.678, 'Parque Residencial Los Cedros',       'Cl. 50 Norte #15-01, Armenia','Restauración fachadas y cubiertas',  'En ejecución',  692350137, 'María del Pilar Rubio López');

  // ── LEYENDA ─────────────────────────────────────────────────────────────────
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <div class="legend-title">Referencias</div>
      <div class="legend-item"><div class="dot" style="background:#F0921E"></div> Finalizado</div>
      <div class="legend-item"><div class="dot" style="background:#f0c040"></div> En ejecución</div>
      <div style="margin-top:8px;font-size:11px;color:#aab;">Haz clic en cada punto<br>para ver el detalle</div>
    `;
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
