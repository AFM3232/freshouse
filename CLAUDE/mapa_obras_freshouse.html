<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freshouse — Relación de Obras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1C2347;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      background: #1C2347;
      border-bottom: 3px solid #F0921E;
    }
    .logo {
      width: auto;
      height: 48px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #F0921E;
      letter-spacing: 1px;
    }
    header span {
      font-size: 13px;
      color: #aab;
      font-style: italic;
    }
    .badge {
      margin-left: auto;
      background: #F0921E;
      color: #1C2347;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    #map { width: 100%; flex: 1; min-height: 0; }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper {
      background: #1C2347;
      color: #fff;
      border-radius: 8px;
      border: 1.5px solid #F0921E;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: #F0921E; }
    .leaflet-popup-content { margin: 10px 14px; min-width: 220px; }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #F0921E;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .popup-row {
      font-size: 12px;
      color: #ccd;
      margin: 3px 0;
      display: flex;
      gap: 6px;
    }
    .popup-row span:first-child {
      color: #F0921E;
      font-weight: 600;
      min-width: 60px;
    }
    .popup-valor {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: rgba(240,146,30,0.15);
      padding: 4px 8px;
      border-radius: 4px;
      border-left: 3px solid #F0921E;
    }
    .estado-fin { color: #5df598; font-weight: 600; }
    .estado-eje { color: #f0c040; font-weight: 600; }

    /* Legend */
    .legend {
      background: #1C2347;
      border: 1.5px solid #F0921E;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 2;
    }
    .legend-title { font-weight: 700; color: #F0921E; margin-bottom: 4px; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #ccd; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; }
  </style>
</head>

</header>

    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  function fmt(val) {
    return '$' + val.toLocaleString('es-CO');
  }

  function marker(lat, lng, nombre, direccion, actividad, estado, valor, admin) {
    const isEjecucion = estado === 'En ejecución';
    const color = isEjecucion ? '#f0c040' : '#F0921E';

    const circle = L.circleMarker([lat, lng], {
      radius: 9,
      fillColor: color,
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.92
    }).addTo(map);

    const estadoClass = isEjecucion ? 'estado-eje' : 'estado-fin';
    const popup = `
      <div class="popup-title">${nombre}</div>
      <div class="popup-row"><span>Dirección</span><span>${direccion}</span></div>
      <div class="popup-row"><span>Actividad</span><span>${actividad}</span></div>
      <div class="popup-row"><span>Estado</span><span class="${estadoClass}">${estado}</span></div>
      ${admin ? `<div class="popup-row"><span>Admin</span><span>${admin}</span></div>` : ''}
      <div class="popup-valor">${fmt(valor)}</div>
    `;
    circle.bindPopup(popup, { maxWidth: 280 });
    return circle;
  }

</html>
